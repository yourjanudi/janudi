<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Kuchupuuchu ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff758c;
            --secondary: #ff7eb3;
            --accent: #ffc3a0;
            --text-dark: #4a4a4a;
            --white: #ffffff;
            --gold: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(45deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Floating Background Emojis */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .emoji-rain {
            position: absolute;
            font-size: 24px;
            animation: fall linear infinite;
            top: -50px;
        }

        /* The Big Pulsating Heart Background */
        .big-heart-bg {
            position: absolute;
            font-size: 20rem;
            color: rgba(255, 255, 255, 0.2);
            z-index: 0;
            animation: heartbeat 2s infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Start Button Screen */
        .intro-container {
            position: relative;
            z-index: 10;
            text-align: center;
            transition: all 0.8s ease;
        }

        .open-btn {
            background: linear-gradient(to right, #ff512f, #dd2476);
            border: none;
            padding: 20px 50px;
            color: white;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Great Vibes', cursive;
            box-shadow: 0 10px 20px rgba(221, 36, 118, 0.4);
            animation: pulse-btn 1.5s infinite;
        }

        /* The Letter Card */
        .letter-card {
            position: relative;
            width: 90%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            z-index: 5;
            display: none;
            opacity: 0;
            transform: scale(0.9);
            transition: all 1s ease;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid #fff;
        }

        .letter-header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed var(--primary);
            padding-bottom: 15px;
        }

        .letter-header h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3rem;
            color: #d93d59;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* Text Animation Classes */
        .text-line {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.8s ease;
            margin-bottom: 15px;
            line-height: 1.6;
            color: var(--text-dark);
            font-size: 1.05rem;
        }

        .text-line.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .nickname-box {
            background: #fff0f3;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
            border: 1px solid var(--primary);
        }

        .nickname {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            margin: 3px;
            font-size: 0.9rem;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
            animation: popIn 0.5s ease backwards;
        }

        .dua-section {
            background: linear-gradient(to right, #fff1eb, #ace0f9);
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
            font-style: italic;
            border-left: 5px solid var(--gold);
            color: #444;
        }

        .final-sig {
            text-align: right;
            margin-top: 30px;
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #d93d59;
        }

        /* Animations */
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        @keyframes heartbeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.1; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.2; }
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

    </style>
</head>
<body>

    <!-- Big Heart Background -->
    <div class="big-heart-bg">❤️</div>

    <!-- Rain Container -->
    <div class="rain-container" id="rain"></div>

    <!-- Intro Screen -->
    <div class="intro-container" id="intro">
        <button class="open-btn" onclick="startExperience()">
            Click Here My Janudi 💌
        </button>
    </div>

    <!-- Main Letter -->
    <div class="letter-card" id="card">
        <div class="letter-header">
            <h1>My Janudi ✨</h1>
        </div>

        <div id="message-body">
            <!-- Content inject via JS -->
        </div>
    </div>

    <script>
        // 1. Falling Elements Configuration
        const symbols = ['🌹', '🍫', '✨', '🍬', '🌺', '💖', '🕌', '💫'];
        const rainContainer = document.getElementById('rain');

        function createRain() {
            const el = document.createElement('div');
            el.classList.add('emoji-rain');
            el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 3 + 3) + 's';
            el.style.opacity = Math.random();
            rainContainer.appendChild(el);
            setTimeout(() => el.remove(), 6000);
        }

        // 2. The Respectful & Loving Message
        // Using paragraphs in an array for animation control
        const messageParts = [
            "My Dearest Janudi,",
            
            "The world outside is changing dates, but in my world, everything revolves around you. You are my <strong>Only My One</strong>.",
            
            "I know that for you, this date isn't a religious celebration. I respect your beautiful faith, your values, and your heart more than words can say. I never want to wish you something that doesn't align with who you are.",
            
            "I may not be Muslim, but I know that love has no religion. So, instead of a 'New Year' wish, I am making a sincere prayer to the Almighty for you.",
            
            "May Allah (SWT) protect you from every sadness. May He fill your life with blessings (Barakah), keep your beautiful smile shining, and guide you to everything you dream of.",
            
            "You are my everything. You are my:",
            
            // Special Nickname Box HTML
            `<div class="nickname-box">
                <span class="nickname">My Janu ❤️</span>
                <span class="nickname">My Kuchupuuchu 🧸</span>
                <span class="nickname">My Rasmalai 🍬</span>
                <span class="nickname">My Dudu 🍼</span>
                <span class="nickname">My Sweetheart 💖</span>
            </div>`,
            
            "Thank you for being in my life. I promise to always respect you, support your deen, and love you endlessly.",
            
            `<div class="dua-section">
                "O Allah, please keep my Janudi happy, healthy, and safe. Grant her peace in her heart and success in this life and the hereafter. Ameen."
            </div>`
        ];

        // 3. Logic to Start
        function startExperience() {
            // Hide intro
            document.getElementById('intro').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('intro').style.display = 'none';
                
                // Show Card
                const card = document.getElementById('card');
                card.style.display = 'block';
                // Trigger Reflow
                card.offsetHeight;
                card.style.opacity = '1';
                card.style.transform = 'scale(1)';

                // Start Text Animation
                showTextOneByOne();
                
                // Intense Rain
                setInterval(createRain, 200);
            }, 800);
        }

        // 4. Text Animation Logic
        function showTextOneByOne() {
            const container = document.getElementById('message-body');
            let delay = 0;

            messageParts.forEach((part, index) => {
                setTimeout(() => {
                    const p = document.createElement('div');
                    p.classList.add('text-line');
                    p.innerHTML = part;
                    container.appendChild(p);
                    
                    // Trigger fade in
                    setTimeout(() => {
                        p.classList.add('visible');
                        // Auto scroll to bottom as text appears
                        const card = document.getElementById('card');
                        card.scrollTop = card.scrollHeight;
                    }, 100);

                    // Add signature at the very end
                    if(index === messageParts.length - 1) {
                        setTimeout(() => {
                            const sig = document.createElement('div');
                            sig.classList.add('final-sig', 'text-line', 'visible');
                            sig.innerHTML = "- Forever Yours, Janu 💋";
                            container.appendChild(sig);
                            
                            // Scroll to bottom one last time
                             const card = document.getElementById('card');
                             card.scrollTop = card.scrollHeight;
                        }, 1000);
                    }

                }, delay);
                delay += 1500; // Time between paragraphs
            });
        }

        // Start gentle rain initially
        setInterval(createRain, 400);

    </script>
</body>
</html>
